name: Plugin release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
    - name: Publish to Maven Central
      run: |
        export SONATYPE_USERNAME=${{secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME}}
        export SONATYPE_PASSWORD=${{secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD}}
        export SIGNING_KEY=${{secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY}}
        export SIGNING_KEY_ID=${{secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID}}
        export SIGNING_PASSWORD=${{secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD}}
        ./gradlew publishToSonatype